{% extends "base.html" %}
{% block title %}访问验证 · 研迹 · lsh的个人日志{% endblock %}

{% block content %}
<section class="login-page">
  <div class="login-note">
    <p class="eyebrow">PRIVATE RESEARCH ARCHIVE</p>
    <h1>想法需要空间，<br>记录需要边界。</h1>
    <p>这里保存着实验过程、阶段结论与尚未完成的思考。验证身份后，继续今天的研究。</p>
    <div class="orbit-mark"><span>研</span></div>
  </div>
  <div class="login-card">
    <div class="login-lock" aria-hidden="true"><span></span></div>
    <p class="eyebrow">ACCESS CHECK</p>
    <h2>访问验证</h2>
    <p>请输入访客密码或管理员密码</p>
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="field">
        <span>访问密码</span>
        <input type="password" name="password" autocomplete="current-password" autofocus required placeholder="请输入密码">
      </label>
      <button class="primary-button" type="submit">进入科研日志 →</button>
    </form>
    <small>访客只能查看；管理员可以新增、修改和删除日志</small>
  </div>
</section>
{% endblock %}
